name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: гоняем по одному, начатый не прерываем
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Собрать статику
        run: npm run generate
        env:
          # Сайт лежит в подпапке с именем репозитория
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

      - name: Отключить обработку Jekyll
        run: touch .output/public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Очередь публикации у GitHub временами висит дольше стандартных
          # 10 минут (проверено 06.08.2026: сборка проходила, а публикация
          # дважды падала по таймауту в очереди). Ждём до 30 минут.
          timeout: 1800000
